name: astrbot_plugin_xwdraw
desc: 对接小维远端 SD / NovelAI 绘图服务，支持文生图、图生图、NAI 参考图、预设、画廊、群管总开关与分级 R18 审核
help: |
  来点 <提示词> - 文生图；附带图片时为图生图
  绘图帮助 / 绘图帮助 参数 / nai / 预设 / 审核 / 管理 - 分章节帮助
  预设列表 / 角色列表 / 风格列表 / 服装列表 / 预设搜索 <关键词>
  绘图状态 / 绘图公告 / 推荐提示 / 绘图队列 / 绘图模型
  绘图开启 / 绘图关闭 - 群管理员控制当前会话总开关
  R18开启 / R18关闭 / R18状态 - Bot 管理员控制当前会话分级放行
  配置方法：插件配置页填写 api_key、api_url、timeout；
  共用版保持 edition=shared，定制版设为 custom 并按需调整 R18 放行开关。
version: v0.4.0
author: Akiyo-dayo
repo: https://github.com/Akiyo-dayo/astrbot_plugin_xwdraw
